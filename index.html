<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Panda Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT ME: replace/add <img src="..."> lines inside the .slide
     elements in the #track div below with your art. The gallery
     loops endlessly no matter how many slides you have.
     ============================================================ */

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin:0; }

  body{
    min-height:100vh;
    background: linear-gradient(180deg, #ece5d6 0%, #e6ddca 55%, #ddd2ba 100%);
    color: #3a332c;
    font-family: 'Fraunces', serif;
    position: relative;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .spotlight{
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 70vw;
    max-width: 900px;
    height: 60vh;
    background: radial-gradient(ellipse at center, rgba(255,252,244,0.55) 0%, rgba(255,252,244,0) 70%);
    pointer-events: none;
  }

  h1.title{
    position: relative;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.7rem, 4.5vw, 2.6rem);
    letter-spacing: .01em;
    margin: 0 0 44px;
    text-align: center;
    color: #3a332c;
  }

  .stage-wrap{
    position: relative;
    width: 100%;
    max-width: 780px;
  }

  .track{
    display: flex;
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    border-radius: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .track::-webkit-scrollbar{ display: none; }

  .slide{
    flex: 0 0 100%;
    scroll-snap-align: center;
    height: 62vh;
    min-height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
  }

  .frame{
    display: inline-block;
    background: #faf7f0;
    padding: 10px;
    border: 9px solid #2a241d;
    box-shadow: 0 26px 50px rgba(42,36,29,.28), 0 2px 0 rgba(255,255,255,.5) inset;
    max-width: 100%;
  }

  .frame img{
    display: block;
    max-height: 54vh;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  .arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(250,247,240,.9);
    border: 1px solid rgba(42,36,29,.15);
    box-shadow: 0 8px 20px rgba(42,36,29,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .arrow:hover{ transform: translateY(-50%) scale(1.06); box-shadow: 0 10px 24px rgba(42,36,29,.28); }
  .arrow:focus-visible{ outline: 1.5px solid #8a7a5c; outline-offset: 3px; }
  .arrow.prev{ left: -22px; }
  .arrow.next{ right: -22px; }
  .arrow svg{ width: 18px; height: 18px; stroke: #3a332c; }

  .dots{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }
  .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(58,51,44,.28);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .dot:focus-visible{ outline: 1.5px solid #8a7a5c; outline-offset: 3px; }
  .dot.active{ background: #8a7a5c; transform: scale(1.3); }

  @media (max-width: 560px){
    .arrow.prev{ left: 6px; }
    .arrow.next{ right: 6px; }
    .arrow{ width: 40px; height: 40px; }
  }
</style>
</head>
<body>

<div class="spotlight" aria-hidden="true"></div>

<h1 class="title">The Panda Collection</h1>

<div class="stage-wrap">
  <div class="track" id="track">
    <!-- real slides go here, in order -->
    <div class="slide"><div class="frame"><img src="pone.png" alt=""></div></div>
    <div class="slide"><div class="frame"><img src="pthree.png" alt=""></div></div>
    <div class="slide"><div class="frame"><img src="ptwo.jpg" alt=""></div></div>
    <div class="slide"><div class="frame"><img src="pfour.png" alt=""></div></div>
    <div class="slide"><div class="frame"><img src="pfive.jpg" alt=""></div></div>
    <div class="slide"><div class="frame"><img src="https://picsum.photos/seed/panda6/800/800" alt=""></div></div>
  </div>

  <button class="arrow prev" id="prevBtn" aria-label="Previous piece">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="arrow next" id="nextBtn" aria-label="Next piece">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
</div>

<div class="dots" id="dots"></div>

<script>
  var track = document.getElementById('track');
  var dotsWrap = document.getElementById('dots');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  // ---- build an infinite loop by cloning the first/last real slides ----
  var realSlides = Array.prototype.slice.call(track.children);
  var count = realSlides.length;

  var firstClone = realSlides[0].cloneNode(true);
  var lastClone = realSlides[count - 1].cloneNode(true);
  firstClone.setAttribute('aria-hidden', 'true');
  lastClone.setAttribute('aria-hidden', 'true');

  track.appendChild(firstClone);                  // clone of first goes at the end
  track.insertBefore(lastClone, realSlides[0]);    // clone of last goes at the start

  // index 0 = clone of last, 1..count = real slides, count+1 = clone of first
  var index = 1;
  var programmatic = false;

  // dots reflect only the real slides
  for(var i = 0; i < count; i++){
    var d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Go to piece ' + (i + 1));
    d.addEventListener('click', (function(n){ return function(){ goTo(n + 1); }; })(i));
    dotsWrap.appendChild(d);
  }
  var dots = document.querySelectorAll('.dot');

  function realIndex(i){
    return ((i - 1) + count) % count;
  }

  function updateDots(){
    var r = realIndex(index);
    dots.forEach(function(dt, i){ dt.classList.toggle('active', i === r); });
  }

  function jumpInstant(target){
    programmatic = true;
    track.style.scrollBehavior = 'auto';
    track.scrollLeft = target * track.clientWidth;
    void track.offsetHeight; // force reflow
    track.style.scrollBehavior = '';
    index = target;
    updateDots();
    setTimeout(function(){ programmatic = false; }, 30);
  }

  function goTo(n){
    programmatic = true;
    index = n;
    track.scrollTo({ left: index * track.clientWidth, behavior: 'smooth' });
    updateDots();
  }

  var scrollTimeout;
  track.addEventListener('scroll', function(){
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(function(){
      var newIndex = Math.round(track.scrollLeft / track.clientWidth);
      if(newIndex === 0){
        jumpInstant(count);        // landed on the "last" clone -> snap to real last
      } else if(newIndex === count + 1){
        jumpInstant(1);            // landed on the "first" clone -> snap to real first
      } else {
        index = newIndex;
        updateDots();
        programmatic = false;
      }
    }, 120);
  }, { passive: true });

  prevBtn.addEventListener('click', function(){ goTo(index - 1); });
  nextBtn.addEventListener('click', function(){ goTo(index + 1); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo(index - 1);
    if(e.key === 'ArrowRight') goTo(index + 1);
  });

  window.addEventListener('resize', function(){
    jumpInstant(index);
  });

  // initial position: start on the first real slide, no animation
  jumpInstant(1);
</script>

</body>
</html>
